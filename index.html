<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vancle blog</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ 顶部毛玻璃导航栏 ============ -->
  <header class="nav glass">
    <div class="nav-left">
      <img src="images/avatar1.jpg" class="nav-avatar" alt="avatar">
      <span class="nav-title">vancle blog</span>
    </div>

    <nav class="nav-center" id="nav-center">
      <a href="#" class="nav-link active" data-page="home">首页</a>
      <a href="#" class="nav-link" data-page="articles">文章</a>
      <a href="#" class="nav-link" data-page="essays">随笔</a>
      <a href="#" class="nav-link" data-page="projects">项目</a>
      <a href="#" class="nav-link" data-page="study">study</a>
    </nav>

    <div class="nav-right">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="搜索…" autocomplete="off">
        <div id="search-results" class="search-results hidden"></div>
      </div>
      <button id="lang-toggle" class="icon-btn" title="中英切换 / Language">🌐</button>
    </div>
  </header>

  <!-- ============ 页面：首页 ============ -->
  <main id="page-home" class="page active">
    <!-- 上半屏背景图 -->
    <section class="hero">
      <div class="hero-text">
        <h1 class="hero-line1">hello friend</h1>
        <h2 class="hero-line2">欢迎来到 vancle 的博客</h2>
      </div>
    </section>

    <!-- 下半屏两个毛玻璃卡片 -->
    <section class="home-cards">
      <!-- 左边：竖长卡片（头像2 + 关于我） -->
      <div class="card card-tall glass">
        <img src="images/avatar2.jpg" class="about-avatar" alt="avatar2">
        <div class="about-text">
          <h3 class="about-name">vancle</h3>
          <p class="about-desc">这里是我的自我介绍，可以在 content.js 里修改这段文字。</p>
        </div>
      </div>

      <!-- 右边：横长卡片（随笔预览） -->
      <div class="card card-wide glass">
        <h3 class="card-title">随笔 <span class="card-title-sep">|</span> <span class="card-title-sub">第一篇随笔</span></h3>
        <p class="essay-preview">这里是随笔的预览内容，同样可以在 content.js 里修改。</p>
        <a href="#" class="card-more" data-goto="essays">阅读更多 →</a>
      </div>
    </section>
  </main>

  <!-- ============ 页面：文章 ============ -->
  <main id="page-articles" class="page">
    <div class="page-container glass">
      <h2 class="page-title">文章</h2>
      <div id="articles-list" class="list"></div>
    </div>
  </main>

  <!-- ============ 页面：随笔 ============ -->
  <main id="page-essays" class="page">
    <div class="page-container glass">
      <h2 class="page-title">随笔</h2>
      <div id="essays-list" class="list"></div>
    </div>
  </main>

  <!-- ============ 页面：项目 ============ -->
  <main id="page-projects" class="page">
    <div class="page-container glass">
      <h2 class="page-title">项目</h2>
      <div id="projects-list" class="grid"></div>
    </div>
  </main>

  <!-- ============ 页面：study ============ -->
  <main id="page-study" class="page">
    <div class="page-container glass">
      <h2 class="page-title">study</h2>
      <div id="study-list" class="list"></div>
    </div>
  </main>

  <!-- ============ 音乐播放器 ============ -->
  <div id="music-player" class="music-player glass">
    <button id="music-toggle" class="music-toggle" title="音乐播放器">🎵</button>
    <div id="music-panel" class="music-panel hidden">
      <div class="music-now">
        <div class="music-cover">🎧</div>
        <div class="music-info">
          <div class="music-title">—</div>
          <div class="music-artist">—</div>
        </div>
      </div>
      <div class="music-controls">
        <button id="music-prev" class="music-btn">⏮</button>
        <button id="music-play" class="music-btn music-play">▶</button>
        <button id="music-next" class="music-btn">⏭</button>
      </div>
      <ul id="music-playlist" class="music-playlist"></ul>
      <audio id="music-audio"></audio>
    </div>
  </div>

  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
